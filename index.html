<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Sacred Union</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Source+Serif+Pro:ital,wght@1,400&display=swap" rel="stylesheet">

  <!-- Typed.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

  <style>
    body {
      margin: 0;
      background: var(--blue-gradient, linear-gradient(102deg, #FBFAFA -0.22%, #F7F8FA 84.88%, #BDE0FF 97.97%, #B9DFFF 103.64%));
      color: #333;
      text-align: center;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 2rem;
      padding: 1.5rem 1rem;
      background: transparent;
      position: absolute;
      top: 0;
      left: 0;
    }
    .navbar a {
      text-decoration: none;
      color: #353635;
      font-size: 18px;
      font-weight: 400;
      text-transform: lowercase;
    }
    .navbar .start-btn {
      background: #B9DFFF;
      padding: 0.4rem 1.2rem;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 500;
      text-transform: lowercase;
      border: none;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      padding-top: 10rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero h1 {
      color: #D21117;
      font-family: "DM Sans", sans-serif;
      font-size: 72px;
      font-weight: 400;
      text-transform: lowercase;
      margin: 0;
    }
    .hero p {
      color: #D21117;
      font-family: "Source Serif Pro", serif;
      font-size: 28px;
      font-style: italic;
      margin-top: 0.8rem;
      margin-bottom: 2rem;
    }

    /* Q&A Bubble */
    .search-box {
      width: 572px;
      height: 58px;
      border-radius: 200px;
      background: #B9DFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-family: "DM Sans", sans-serif;
      color: #353635;
      overflow: hidden;
    }
    .search-box span {
      text-align: center;
    }

    .answer {
      font-size: 1.1rem;
      color: #555;
      min-height: 2rem;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      margin-top: 1rem;
    }
    .answer.show {
      opacity: 1;
    }

    /* Collage Section */
    .collage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 4rem auto;
      max-width: 1200px;
      padding: 0 1rem;
    }

    .polaroid {
      background: #fff;
      padding: 0.7rem;
      border-radius: 6px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
      width: 220px;
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
    }
    .polaroid:nth-child(2) { transform: rotate(3deg); }
    .polaroid:nth-child(3) { transform: rotate(-2deg); }
    .polaroid:nth-child(4) { transform: rotate(2deg); }
    .polaroid:nth-child(5) { transform: rotate(-1deg); }

    .polaroid img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .polaroid p {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #333;
    }
    .polaroid:hover {
      transform: scale(1.05) rotate(0deg);
      z-index: 5;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="#">about</a>
    <a href="#">about</a>
    <button class="start-btn">start now</button>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <h1>our sacred union</h1>
    <p>Bring meaning to your marriage with Vedānta</p>

    <!-- Animated Q&A Bubble -->
    <div class="search-box">
      <span id="typed-question"></span>
    </div>
    <div class="answer" id="answer"></div>
  </section>

  <!-- Q&A Script -->
  <script>
    const qaPairs = [
      { q: "How to be happy?", a: "Spread happiness to be happy." },
      { q: "How do I feel Bhagavan?", a: "Accept His presence and then feel His power." },
      { q: "What is sacred union?", a: "The harmony of love, spirit, and truth." }
    ];

    let currentIndex = 0;
    const answerEl = document.getElementById("answer");
    const questionEl = document.getElementById("typed-question");

    function showQA(index) {
      const { q, a } = qaPairs[index];
      questionEl.textContent = "";
      answerEl.textContent = "";
      answerEl.classList.remove("show");

      new Typed("#typed-question", {
        strings: [q],
        typeSpeed: 50,
        showCursor: false,
        onComplete: () => {
          answerEl.textContent = a;
          answerEl.classList.add("show");
          setTimeout(() => {
            currentIndex = (currentIndex + 1) % qaPairs.length;
            showQA(currentIndex);
          }, 2500);
        }
      });
    }

    showQA(currentIndex);
  </script>

  <!-- Collage Section -->
  <section class="collage">
    <div class="polaroid">
      <img src="img1.jpg" alt="Image 1">
      <p>image 1</p>
    </div>
    <div class="polaroid">
      <img src="img2.jpg" alt="Image 2">
      <p>image 2</p>
    </div>
    <div class="polaroid">
      <img src="img3.jpg" alt="Image 3">
      <p>image 3</p>
    </div>
    <div class="polaroid">
      <img src="img4.jpg" alt="Image 4">
      <p>image 4</p>
    </div>
    <div class="polaroid">
      <img src="img5.jpg" alt="Image 5">
      <p>image 5</p>
    </div>
  </section>
</body>
</html>

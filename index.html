<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Sacred Union</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500&family=Source+Serif+Pro:ital,wght@1,400&display=swap" rel="stylesheet">

  <!-- Typed.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

  <style>
    body {
      margin: 0;
      background: var(--blue-gradient, linear-gradient(102deg, #FBFAFA -0.22%, #F7F8FA 84.88%, #BDE0FF 97.97%, #B9DFFF 103.64%));
      color: #333;
      text-align: center;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.8);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .navbar .logo {
      font-weight: 700;
      font-size: 1.4rem;
    }
    .navbar .links {
      display: flex;
      gap: 2rem;
    }
    .navbar .links a {
      text-decoration: none;
      color: #353635;
      font-family: "DM Sans", sans-serif;
      font-size: 24px;
      font-weight: 300;
      line-height: 100px;
    }
    .navbar .cta button {
      display: flex;
      width: 105px;
      height: 48px;
      justify-content: center;
      align-items: center;
      color: #353635;
      text-align: center;
      font-family: "DM Sans", sans-serif;
      font-size: 24px;
      font-weight: 300;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .navbar .cta button:hover {
      opacity: 0.7;
    }

    /* Hero Section */
    .hero {
      padding-top: 8rem;
      padding-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero h1 {
      display: flex;
      width: 1277px;
      height: 224px;
      justify-content: center;
      color: #D21117;
      text-align: center;
      font-family: "DM Sans", sans-serif;
      font-size: 128px;
      font-weight: 300;
      line-height: 100px;
      letter-spacing: -3px;
      margin: 0;
    }
    .hero p {
      display: flex;
      width: 563px;
      height: 137px;
      justify-content: center;
      color: #D21117;
      text-align: center;
      font-family: "Source Serif Pro", serif;
      font-size: 48px;
      font-style: italic;
      font-weight: 400;
      line-height: 50px;
      margin: 2rem auto 3rem auto;
    }

    /* Q&A Section */
    .qa-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 4rem;
    }
    .search-box {
      width: 572px;
      height: 58px;
      border-radius: 200px;
      background: #B9DFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      font-family: "DM Sans", sans-serif;
    }
    .search-box span {
      flex: 1;
      text-align: center;
    }
    .answer {
      font-size: 1.1rem;
      color: #555;
      min-height: 2rem;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .answer.show {
      opacity: 1;
    }

    /* Collage Section */
    .collage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 4rem auto;
      max-width: 1200px;
      padding: 0 1rem;
    }

    .polaroid {
      background: #fff;
      padding: 0.7rem;
      border-radius: 6px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
      width: 220px;
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
      text-align: center;
      font-family: 'Playfair Display', serif;
    }
    .polaroid:nth-child(2) { transform: rotate(3deg); }
    .polaroid:nth-child(3) { transform: rotate(-2deg); }
    .polaroid:nth-child(4) { transform: rotate(2deg); }
    .polaroid:nth-child(5) { transform: rotate(-1deg); }

    .polaroid img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .polaroid p {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #333;
    }
    .polaroid:hover {
      transform: scale(1.05) rotate(0deg);
      z-index: 5;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Sacred Union</div>
    <div class="links">
      <a href="#">Tab 1</a>
      <a href="#">Tab 2</a>
      <a href="#">Tab 3</a>
    </div>
    <div class="cta">
      <button>Dive In</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <h1>Our Sacred Union</h1>
    <p>Something beautiful is on the way. Stay connected.</p>
  </section>

  <!-- Q&A Section -->
  <section class="qa-section">
    <div class="search-box">
      <span id="typed-question"></span>
    </div>
    <div class="answer" id="answer"></div>
  </section>

  <!-- q and a script -->
  <script>
    const qaPairs = [
      { q: "How to be happy?", a: "Spread happiness to be happy." },
      { q: "How do I feel Bhagavan?", a: "Accept His presence and then feel His power." },
      { q: "What is sacred union?", a: "The harmony of love, spirit, and truth." }
    ];

    let currentIndex = 0;
    const answerEl = document.getElementById("answer");
    const questionEl = document.getElementById("typed-question");

    function showQA(index) {
      const { q, a } = qaPairs[index];
      questionEl.textContent = "";
      answerEl.textContent = "";
      answerEl.classList.remove("show");

      new Typed("#typed-question", {
        strings: [q],
        typeSpeed: 50,
        showCursor: false,
        onComplete: () => {
          answerEl.textContent = a;
          answerEl.classList.add("show");
          setTimeout(() => {
            currentIndex = (currentIndex + 1) % qaPairs.length;
            showQA(currentIndex);
          }, 2500);
        }
      });
    }

    showQA(currentIndex);
  </script>

  <!-- Collage Section -->
  <section class="collage">
    <div class="polaroid">
      <img src="img1.jpg" alt="Image 1">
      <p>image 1</p>
    </div>
    <div class="polaroid">
      <img src="img2.jpg" alt="Image 2">
      <p>image 2</p>
    </div>
    <div class="polaroid">
      <img src="img3.jpg" alt="Image 3">
      <p>image 3</p>
    </div>
    <div class="polaroid">
      <img src="img4.jpg" alt="Image 4">
      <p>image 4</p>
    </div>
    <div class="polaroid">
      <img src="img5.jpg" alt="Image 5">
      <p>image 5</p>
    </div>
  </section>
</body>
</html>

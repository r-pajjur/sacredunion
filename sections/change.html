<script>
  const changeBoxes = document.querySelectorAll(".change-box");
  const changeTitleEl = document.getElementById("contentTitle");
  const changeTextEl = document.getElementById("contentText");

  const changeContentData = {
    watch: "something beautiful is on the way. stay connected. something beautiful is on the way. stay connected.",
    read: "open your mind to sacred wisdom. reflect deeply, read slowly, and let each word transform your awareness.",
    practice: "turn insight into action. embody the lessons. practice devotion, presence, and kindness.",
    internalize: "make the sacred your second nature. let the truth sink in until it lives in your every breath."
  };

  changeBoxes.forEach((box) => {
    box.addEventListener("click", () => {
      changeBoxes.forEach((b) => b.classList.remove("active"));
      box.classList.add("active");

      const topic = box.dataset.topic;
      changeTitleEl.textContent = `${topic} ↑`;
      changeTextEl.textContent = changeContentData[topic];
    });
  });
</script>
